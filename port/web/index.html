<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snail Mail</title>
<style>
  :root { color-scheme: dark; --ink: #f4e9ff; --dim: #b9a3d6; --glow: #ff7ad9; --accent: #ffd36e; }
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  main { position: relative; width: min(100vw, calc(100vh * 4 / 3)); }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; cursor: none; outline: none; }
  #status { position: fixed; inset: auto 0 0 0; padding: 6px 10px; font-size: 12px; color: #888; white-space: pre-wrap; }
  #status.error { color: #f77; }

  /* Splash: covers the screen until the game is loaded and a click or key starts it. */
  #splash {
    position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden;
    container-type: inline-size; color: var(--ink); text-align: center; user-select: none;
    background:
      radial-gradient(ellipse 60% 45% at 30% 35%, #c2187a88, transparent 70%),
      radial-gradient(ellipse 55% 50% at 75% 70%, #5b1fa688, transparent 70%),
      radial-gradient(ellipse 90% 80% at 50% 50%, #2a0a3a, #07020d 75%);
    transition: opacity 0.4s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash::before {
    content: ""; position: absolute; inset: -50%;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff, transparent), radial-gradient(1px 1px at 30% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 15%, #fff, transparent), radial-gradient(1px 1px at 70% 45%, #fff, transparent),
      radial-gradient(1px 1px at 85% 80%, #fff, transparent), radial-gradient(1.5px 1.5px at 20% 90%, #fff, transparent),
      radial-gradient(1px 1px at 45% 50%, #fff, transparent), radial-gradient(1px 1px at 90% 10%, #fff, transparent);
    background-size: 23% 31%; opacity: 0.55; animation: drift 120s linear infinite;
  }
  @keyframes drift { to { transform: translate(-23%, -31%); } }
  .card { position: relative; display: grid; justify-items: center; gap: 2.2cqi; }
  .snail { width: 22cqi; filter: drop-shadow(0 0 2cqi #ff7ad966); animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-0.8cqi); } }
  h1 {
    margin: 0; font: 900 10.5cqi/0.9 "Trebuchet MS", system-ui, sans-serif; letter-spacing: 0.04em;
    font-style: italic; text-transform: uppercase;
    background: linear-gradient(#fff6c9, var(--accent) 45%, #ff8a3d); -webkit-background-clip: text; background-clip: text;
    color: transparent; filter: drop-shadow(0 0.5cqi 0 #6a1050) drop-shadow(0 0 2.5cqi #ff7ad955);
  }
  .tagline { margin: 0; font-size: 2.1cqi; color: var(--dim); letter-spacing: 0.08em; }
  .progress { width: 38cqi; height: 0.9cqi; border-radius: 1cqi; background: #ffffff1a; overflow: hidden; }
  .progress > div { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--glow), var(--accent)); transition: width 0.15s; }
  .detail { min-height: 1.2em; font-size: 1.9cqi; color: var(--dim); font-variant-numeric: tabular-nums; }
  #play {
    display: none; padding: 1.4cqi 4.5cqi; border: 0.25cqi solid var(--accent); border-radius: 10cqi;
    background: #ffd36e14; color: var(--accent); font: 700 2.8cqi system-ui, sans-serif; letter-spacing: 0.12em;
    text-transform: uppercase; cursor: pointer; animation: pulse 1.6s ease-in-out infinite;
  }
  #play:hover, #play:focus-visible { background: #ffd36e2e; outline: none; }
  @keyframes pulse { 50% { box-shadow: 0 0 3cqi #ffd36e55; } }
  #splash.ready .progress { display: none; }
  #splash.ready #play { display: block; }
</style>
</head>
<body>
<main>
  <canvas id="screen" width="640" height="480" tabindex="0"></canvas>
  <div id="splash">
    <div class="card">
      <svg class="snail" viewBox="0 0 120 80" aria-hidden="true">
        <defs>
          <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffb3e6"/><stop offset="1" stop-color="#b0308a"/>
          </linearGradient>
          <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#f0a040"/>
          </linearGradient>
        </defs>
        <path d="M8 70 Q8 58 22 58 L84 58 Q98 58 102 44 L106 30 Q108 24 112 26 Q116 28 113 34 L108 56 Q104 70 86 70 Z" fill="url(#body)"/>
        <path d="M106 30 L101 14 M110 28 L112 12" stroke="#f0a040" stroke-width="3" stroke-linecap="round"/>
        <circle cx="101" cy="13" r="3.5" fill="#2a0a3a"/><circle cx="112" cy="11" r="3.5" fill="#2a0a3a"/>
        <circle cx="54" cy="36" r="27" fill="url(#shell)"/>
        <path d="M55.4 37.4 L55.3 37.7 L55.2 38.0 L55.0 38.3 L54.7 38.6 L54.4 38.8 L54.1 39.0 L53.7 39.2 L53.3 39.3 L52.8 39.3 L52.3 39.3 L51.8 39.2 L51.4 39.0 L50.9 38.8 L50.4 38.4 L50.0 38.0 L49.6 37.6 L49.3 37.1 L49.0 36.5 L48.8 35.8 L48.7 35.2 L48.7 34.5 L48.8 33.7 L49.0 33.0 L49.3 32.3 L49.6 31.6 L50.1 31.0 L50.7 30.4 L51.4 29.9 L52.1 29.4 L52.9 29.1 L53.8 28.8 L54.7 28.7 L55.6 28.7 L56.6 28.8 L57.6 29.0 L58.5 29.4 L59.4 29.9 L60.3 30.5 L61.0 31.2 L61.7 32.1 L62.3 33.0 L62.8 34.0 L63.1 35.1 L63.3 36.3 L63.4 37.5 L63.3 38.7 L63.0 39.9 L62.6 41.1 L62.0 42.2 L61.3 43.3 L60.4 44.3 L59.4 45.2 L58.3 45.9 L57.1 46.6 L55.7 47.0 L54.4 47.3 L52.9 47.4 L51.5 47.4 L50.0 47.1 L48.6 46.7 L47.2 46.1 L45.8 45.3 L44.6 44.3 L43.5 43.1 L42.6 41.8 L41.8 40.4 L41.2 38.9 L40.7 37.3 L40.5 35.6 L40.5 33.9 L40.7 32.1 L41.2 30.4 L41.8 28.8 L42.7 27.2 L43.7 25.7 L45.0 24.4 L46.4 23.2 L48.0 22.2 L49.8 21.4 L51.6 20.9 L53.5 20.5 L55.5 20.4 L57.5 20.5 L59.4 20.9 L61.3 21.6 L63.2 22.5 L64.9 23.6 L66.5 25.0 L67.9 26.5 L69.1 28.3 L70.2 30.2 L70.9 32.2 L71.4 34.4 L71.7 36.6 L71.6 38.8 L71.3 41.0 L70.7 43.2 L69.8 45.3 L68.6 47.3 L67.2 49.2 L65.5 50.9 L63.7 52.4 L61.6 53.6 L59.4 54.6 L57.1 55.3 L54.6 55.7 L52.1 55.7 L49.6 55.5 L47.2 55.0 L44.8 54.1 L42.5 53.0 L40.3 51.5 L38.4 49.8 L36.6 47.8 L35.1 45.6 L33.9 43.2 L33.0 40.7 L32.4 38.0 L32.2 35.3 L32.3 32.6"
              fill="none" stroke="#6a1050" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
        <rect x="40" y="2" width="28" height="12" rx="2" fill="#fff6e0" stroke="#6a1050" stroke-width="2" transform="rotate(-12 54 8)"/>
        <path d="M42 5 L54 10 L66 3" fill="none" stroke="#6a1050" stroke-width="2" transform="rotate(-12 54 8)"/>
      </svg>
      <h1>Snail Mail</h1>
      <p class="tagline">DELIVERING THE MAIL ACROSS THE GALAXY</p>
      <div class="progress"><div id="bar"></div></div>
      <button id="play" type="button">Click to play</button>
      <div class="detail" id="detail">Loading…</div>
    </div>
  </div>
</main>
<div id="status"></div>
<script type="module" src="snail.js"></script>
</body>
</html>
