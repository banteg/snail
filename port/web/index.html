<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snail Mail</title>
<link rel="preload" as="image" href="loading.avif">
<link rel="preload" as="image" href="loading-bar.avif">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  main { position: relative; width: min(100vw, calc(100vh * 4 / 3)); }
  canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; cursor: none; outline: none; }
  #status { position: fixed; inset: auto 0 0 0; padding: 6px 10px; font-size: 12px; color: #888; white-space: pre-wrap; }
  #status.error { color: #f77; }

  /* The game's own loading screen (cRLoadingBar), laid out in its 640x480 coordinates. */
  #splash { position: absolute; inset: 0; container-type: inline-size; background: #2a0b3e; user-select: none; transition: opacity 0.3s; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash img { position: absolute; display: block; }
  .screen { inset: 0; width: 100%; height: 100%; }
  /* The lit bar at (192, 289), 256x32, shown up to the current percentage. */
  #bar { left: 30%; top: 60.2083%; width: 40%; height: 6.6667%; clip-path: inset(0 100% 0 0); }
  #play {
    position: absolute; left: 0; right: 0; top: 67.5%; display: none; margin: 0;
    font: italic 900 3.6cqi/1 "Arial Narrow", "Helvetica Neue", sans-serif; letter-spacing: 0.06em; text-align: center;
    text-transform: uppercase; color: #ff8a1e; cursor: pointer;
    text-shadow: 0 0 0.3cqi #3a0d00, 0.2cqi 0.2cqi 0 #3a0d00, -0.1cqi -0.1cqi 0 #3a0d00;
    animation: blink 1.2s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0.35; } }
  #splash.ready #play { display: block; }
</style>
</head>
<body>
<main>
  <canvas id="screen" width="640" height="480" tabindex="0"></canvas>
  <div id="splash">
    <img class="screen" src="loading.avif" alt="">
    <img id="bar" src="loading-bar.avif" alt="">
    <p id="play">Click to play</p>
  </div>
</main>
<div id="status"></div>
<script type="module" src="snail.js"></script>
</body>
</html>
