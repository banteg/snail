name: Decompilation progress

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify source-bound evidence and export progress
        run: uv run --no-sync snail match report

      - name: Validate with objdiff's report parser
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/objdiff-cli" \
            https://github.com/encounter/objdiff/releases/download/v3.8.1/objdiff-cli-linux-x86_64
          echo "c8290281e82114bcc1a06ff73061110d3902a177822e750337de2537188e358f  $RUNNER_TEMP/objdiff-cli" | sha256sum --check
          chmod +x "$RUNNER_TEMP/objdiff-cli"
          "$RUNNER_TEMP/objdiff-cli" report changes artifacts/decomp/report.json artifacts/decomp/report.json

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: win32-reflexive_report
          path: artifacts/decomp/report.json
          if-no-files-found: error

      - name: Upload matching proof summary
        uses: actions/upload-artifact@v4
        with:
          name: win32-reflexive_proof
          path: artifacts/decomp/proof-summary.json
          if-no-files-found: error
