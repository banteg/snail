name: Decompilation progress

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch and verify native matching target
        run: uv run --no-sync tools/match/fetch_target.py

      - name: Fetch and verify pinned objdiff
        run: uv run --no-sync tools/match/fetch_objdiff.py

      - name: Test portable matching and public metric accounting
        run: uv run --no-sync pytest -q -m "not local_artifacts"

      - name: Verify source-bound evidence and export progress
        run: uv run --no-sync snail match report

      - name: Validate with objdiff's report parser
        run: tools/match/bin/objdiff-cli report changes artifacts/decomp/report.json artifacts/decomp/report.json

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: win32-reflexive_report
          path: artifacts/decomp/report.json
          if-no-files-found: error

      - name: Upload matching proof summary
        uses: actions/upload-artifact@v4
        with:
          name: win32-reflexive_proof
          path: artifacts/decomp/proof-summary.json
          if-no-files-found: error
